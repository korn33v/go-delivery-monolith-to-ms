global:
  scrape_interval: 3s
  evaluation_interval: 3s
scrape_configs:
  - job_name: monolith
    static_configs:
      - targets: ["monolith:8081"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: local-services
    static_configs:
      - targets:
          - "host.docker.internal:8082"
          - "host.docker.internal:8083"
          - "host.docker.internal:8084"
