server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
    }

    # SPA routes fall back to the React entry point. API calls go to Gateway.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
