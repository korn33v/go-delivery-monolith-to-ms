name: godelivery-saga

x-app-environment: &app-environment
  SAGA_ENABLED: "true"
  SAGA_DEMO_FAILURES: "${SAGA_DEMO_FAILURES:-true}"
  SAGA_MAX_ATTEMPTS: "${SAGA_MAX_ATTEMPTS:-3}"
  KAFKA_BROKERS: kafka:9092
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  ROUTE_STOCK_TO_MICROSERVICE: "true"
  ROUTE_ORDER_TO_MICROSERVICE: "true"
  ASYNC_PAYMENT_ACTIVE: "true"
  MONOLITH_STOCK_BRIDGE_ACTIVE: "false"

x-app: &app
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["saga-kafka:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in saga.payment.commands.v1 saga.stock.commands.v1 saga.events.v1 saga.payment.commands.v1.dlq saga.stock.commands.v1.dlq saga.events.v1.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres_demo
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - saga-postgres:/var/lib/postgresql/data
      - ./infra/saga/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  order-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.saga
      args: {SERVICE: order-service}
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://orders:orders_demo@postgres:5432/orders?sslmode=disable
    ports: ["127.0.0.1:8083:8083"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8083/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  payment-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.saga
      args: {SERVICE: payment-service}
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://payments:payments_demo@postgres:5432/payments?sslmode=disable
    ports: ["127.0.0.1:8084:8084"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8084/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  stock-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.saga
      args: {SERVICE: stock-service}
    environment:
      <<: *app-environment
      DATABASE_URL: postgres://stock:stock_demo@postgres:5432/stock?sslmode=disable
    ports: ["127.0.0.1:8082:8082"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      <<: *app-environment
      MONOLITH_URL: http://monolith:8081
      STOCK_URL: http://stock-service:8082
      ORDER_URL: http://order-service:8083
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      order-service:
        condition: service_healthy
      stock-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  saga-postgres:
  saga-kafka:
