basePath: /
definitions:
  contract.APIError:
    properties:
      error:
        type: string
      order:
        $ref: '#/definitions/contract.Order'
    type: object
  contract.CreateOrder:
    properties:
      product_id:
        example: 1
        type: integer
      quantity:
        example: 1
        type: integer
    type: object
  contract.Order:
    properties:
      amount_cents:
        type: integer
      id:
        type: string
      owner:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      status:
        type: string
    type: object
  contract.Product:
    properties:
      available:
        type: integer
      id:
        type: integer
      name:
        type: string
      price_cents:
        type: integer
    type: object
info:
  contact: {}
  description: Создание и чтение заказов, собственное хранилище, Kafka.
  title: GoDelivery monolith
  version: "1.0"
paths:
  /api/v1/orders:
    post:
      consumes:
      - application/json
      parameters:
      - description: Товар и количество
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/contract.CreateOrder'
      produces:
      - application/json
      responses:
        "201":
          description: Локальная оплата завершена
          schema:
            $ref: '#/definitions/contract.Order'
        "202":
          description: Заказ принят; оплата через Kafka
          schema:
            $ref: '#/definitions/contract.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/contract.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contract.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/contract.APIError'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/contract.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Оформить заказ
      tags:
      - orders
  /api/v1/orders/{id}:
    get:
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.Order'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Получить статус заказа
      tags:
      - orders
  /api/v1/stock/{id}:
    get:
      parameters:
      - description: ID товара
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.Product'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Получить локальный остаток монолита
      tags:
      - stock
swagger: "2.0"
