basePath: /
definitions:
  contract.APIError:
    properties:
      error:
        type: string
      order:
        $ref: '#/definitions/contract.Order'
    type: object
  contract.Order:
    properties:
      amount_cents:
        type: integer
      id:
        type: string
      owner:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      status:
        type: string
    type: object
  contract.SagaAPIError:
    properties:
      error:
        type: string
      order:
        $ref: '#/definitions/contract.SagaOrder'
    type: object
  contract.SagaCreateOrder:
    properties:
      demo_failure:
        enum:
        - payment
        - refund
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
    type: object
  contract.SagaOrder:
    properties:
      amount_cents:
        type: integer
      failure_reason:
        type: string
      id:
        type: string
      owner:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      saga_id:
        type: string
      saga_state:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Создание и чтение заказов, собственное хранилище, Kafka.
  title: GoDelivery order-service
  version: "1.0"
paths:
  /api/v1/orders:
    post:
      consumes:
      - application/json
      parameters:
      - description: Товар и количество; demo_failure принимается только при SAGA_ENABLED
          и SAGA_DEMO_FAILURES
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/contract.SagaCreateOrder'
      produces:
      - application/json
      responses:
        "201":
          description: Локальная оплата завершена
          schema:
            $ref: '#/definitions/contract.Order'
        "202":
          description: Заказ принят; saga_id и saga_state присутствуют в режиме Saga
          schema:
            $ref: '#/definitions/contract.SagaOrder'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/contract.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contract.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/contract.APIError'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/contract.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Оформить заказ
      tags:
      - orders
  /api/v1/orders/{id}:
    get:
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: В режиме Strangler поля Saga отсутствуют
          schema:
            $ref: '#/definitions/contract.SagaOrder'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Получить статус заказа
      tags:
      - orders
swagger: "2.0"
