basePath: /
definitions:
  config.Flags:
    properties:
      async_payment:
        type: boolean
      order_microservice:
        type: boolean
      stock_bridge:
        type: boolean
      stock_microservice:
        type: boolean
    type: object
  contract.APIError:
    properties:
      error:
        type: string
      order:
        $ref: '#/definitions/contract.Order'
    type: object
  contract.CreateOrder:
    properties:
      product_id:
        example: 1
        type: integer
      quantity:
        example: 1
        type: integer
    type: object
  contract.Order:
    properties:
      amount_cents:
        type: integer
      id:
        type: string
      owner:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      status:
        type: string
    type: object
  contract.Product:
    properties:
      available:
        type: integer
      id:
        type: integer
      name:
        type: string
      price_cents:
        type: integer
    type: object
info:
  contact: {}
  description: Переключение HTTP-маршрутов между монолитом и сервисами.
  title: GoDelivery Strangler Gateway
  version: "1.0"
paths:
  /api/v1/migration:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/config.Flags'
      summary: Текущие флаги миграции (только чтение)
      tags:
      - migration
  /api/v1/orders:
    post:
      consumes:
      - application/json
      parameters:
      - description: Товар и количество
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/contract.CreateOrder'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/contract.Order'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/contract.Order'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/contract.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/contract.APIError'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/contract.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/contract.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Создать заказ через переключаемый маршрут
      tags:
      - orders
  /api/v1/orders/{id}:
    get:
      parameters:
      - description: ID заказа
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.Order'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contract.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Статус заказа; старые ID продолжают обслуживаться монолитом
      tags:
      - orders
  /api/v1/stock/{id}:
    get:
      parameters:
      - description: ID товара
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.Product'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contract.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Остаток через переключаемый маршрут
      tags:
      - stock
swagger: "2.0"
