basePath: /
definitions:
  contract.APIError:
    properties:
      error:
        type: string
      order:
        $ref: '#/definitions/contract.Order'
    type: object
  contract.Order:
    properties:
      amount_cents:
        type: integer
      id:
        type: string
      owner:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
      status:
        type: string
    type: object
  contract.Product:
    properties:
      available:
        type: integer
      id:
        type: integer
      name:
        type: string
      price_cents:
        type: integer
    type: object
  contract.Reservation:
    properties:
      order_id:
        type: string
      product_id:
        type: integer
      quantity:
        type: integer
    type: object
info:
  contact: {}
  description: Изолированный склад; атомарное идемпотентное резервирование.
  title: GoDelivery Stock Service
  version: "1.0"
paths:
  /api/v1/stock/{id}:
    get:
      parameters:
      - description: ID товара
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/contract.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Получить остаток извлечённого склада
      tags:
      - stock
  /api/v1/stock/reservations:
    post:
      consumes:
      - application/json
      description: Повтор с тем же order_id и телом не списывает товар второй раз.
      parameters:
      - description: Резервирование
        in: body
        name: reservation
        required: true
        schema:
          $ref: '#/definitions/contract.Reservation'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/contract.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contract.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/contract.APIError'
      summary: Атомарно проверить и списать остаток
      tags:
      - stock
swagger: "2.0"
